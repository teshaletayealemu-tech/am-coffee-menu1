<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A.M Coffee & Juice — Digital Menu & Ordering</title>
<style>
  :root {
    --primary: #143D32;
    --gold: #C89B54;
    --gold-light: #F7EAD3;
    --accent: #D97724;
    --bg: #F6F4EF;
    --card: #FFFFFF;
    --text: #18221F;
    --muted: #65726E;
    --border: #E2DED5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 115px;
    line-height: 1.4;
  }
  .hero {
    position: relative;
    background: linear-gradient(145deg, #0D2B23 0%, #164438 60%, #1F5B4B 100%);
    color: #fff;
    padding: 16px 16px 22px;
    border-bottom-left-radius: 28px;
    border-bottom-right-radius: 28px;
    box-shadow: 0 12px 28px rgba(13, 43, 35, 0.25);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(200,155,84,0.35);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--gold-light);
  }
  .dot-live {
    width: 7px; height: 7px; border-radius: 50%; background: #34D399;
    box-shadow: 0 0 8px #34D399;
  }
  .controls { display: flex; gap: 5px; align-items: center; }
  select, .top-pill-btn {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 9px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .pay-top-btn {
    background: rgba(200, 155, 84, 0.26);
    border-color: var(--gold);
    color: #FDE68A;
  }
  .waiter-btn {
    background: rgba(217, 119, 36, 0.28);
    border-color: #F59E0B;
    color: #FEF3C7;
  }
  select option { color: #000; background: #fff; }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .brand-logo-svg {
    width: 70px;
    height: 70px;
    border-radius: 18px;
    background: #F4EFE6;
    border: 2px solid var(--gold);
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-title { font-size: 1.42rem; font-weight: 900; color: #fff; }
  .hero-sub { font-size: 0.8rem; color: #D4E2DD; margin-top: 2px; }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    border-radius: 14px;
    border: none;
    font-size: 0.94rem;
    background: #fff;
    color: var(--text);
    box-shadow: 0 4px 14px rgba(0,0,0,0.14);
    outline: none;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    opacity: 0.55;
  }
  .quick-filters {
    display: flex;
    gap: 7px;
    padding: 12px 16px 4px;
    max-width: 720px;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .quick-filters::-webkit-scrollbar { display: none; }
  .qf-btn {
    font-size: 0.76rem;
    font-weight: 800;
    padding: 6px 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
  }
  .qf-btn.active {
    background: var(--gold-light);
    border-color: var(--gold);
    color: #784F12;
  }
  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 16px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 40;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 15px;
    border-radius: 22px;
    font-size: 0.84rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .cat-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .menu-container { padding: 4px 16px 24px; max-width: 720px; margin: 0 auto; }
  .item-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(20, 34, 31, 0.04);
  }
  .item-thumb {
    width: 82px;
    height: 82px;
    border-radius: 14px;
    flex-shrink: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    text-align: center;
  }
  .thumb-emoji { font-size: 2.1rem; line-height: 1.1; }
  .thumb-label { font-size: 0.56rem; letter-spacing: 0.5px; margin-top: 4px; opacity: 0.92; text-transform: uppercase; }
  .tag-badge {
    position: absolute;
    top: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.58);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 2px 5px;
    border-radius: 6px;
  }
  .fav-btn {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(255,255,255,0.9);
    border: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 0.78rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 800; font-size: 0.98rem; color: var(--text); margin-bottom: 3px; }
  .item-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .item-bottom { display: flex; justify-content: space-between; align-items: center; }
  .item-price { font-weight: 900; color: var(--accent); font-size: 0.96rem; }
  .stepper {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--bg);
    padding: 3px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .step-btn {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-btn.minus { background: #DCE3E0; color: var(--primary); }
  .qty { font-weight: 800; min-width: 18px; text-align: center; font-size: 0.9rem; }
  .cart-bar {
    position: fixed;
    bottom: 16px;
    left: 16px;
    right: 16px;
    max-width: 688px;
    margin: 0 auto;
    background: linear-gradient(135deg, #0D2B23 0%, #1E5647 100%);
    color: #fff;
    padding: 14px 18px;
    border-radius: 18px;
    display: none;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 10px 28px rgba(13, 43, 35, 0.36);
    border: 1px solid rgba(200,155,84,0.4);
    cursor: pointer;
    z-index: 60;
  }
  .cart-bar.visible { display: flex; }
  .cart-badge {
    background: var(--gold);
    color: #14221E;
    padding: 4px 10px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 0.9rem;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 22, 18, 0.68);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }

    width: 100%;
    max-width: 720px;
    max-height: 92vh;
